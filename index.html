<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Tracker</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e0da;
  --text:#0b0b0b; --text-2:#52514e; --muted:#77756f;
  --accent:#2a78d6; --grid:#e9e7e2;
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --crit:#d03b3b; --crit-ink:#b42323;
  --shadow:0 6px 24px rgba(0,0,0,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#252523; --border:#34342f;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8d85;
    --accent:#3987e5; --grid:#2b2b28;
    --s1:#3987e5; --s2:#d95926;
    --good-ink:#5ccf5c; --warn-ink:#fab219; --crit-ink:#f07575;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#252523; --border:#34342f;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8d85;
  --accent:#3987e5; --grid:#2b2b28;
  --s1:#3987e5; --s2:#d95926;
  --good-ink:#5ccf5c; --warn-ink:#fab219; --crit-ink:#f07575;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.hwrap{max-width:1120px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--text-2);padding:9px 12px;font:inherit;font-weight:550;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button[aria-current=page]{color:var(--text);border-bottom-color:var(--accent)}
main{max-width:1120px;margin:0 auto;padding:16px 16px 64px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 12px;font-weight:650}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g2>.card{margin-bottom:0}
.stack>*+*{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{color:var(--text-2);font-size:12.5px}
.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:7px 12px;font:inherit;font-weight:550;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12.5px;font-weight:500}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit-ink)}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
select.cat{padding:3px 6px;font-size:13px;max-width:170px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--text-2);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.pos{color:var(--good-ink)}
.muted{color:var(--muted)} .small{font-size:12.5px} .t2{color:var(--text-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.spacer{flex:1}
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{min-width:130px;text-align:center;font-weight:600}
.track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:60px}
.fill{height:100%;border-radius:4px;background:var(--s1)}
.fill.good{background:var(--good)} .fill.warn{background:var(--warn)} .fill.crit{background:var(--crit)}
.st{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:550;white-space:nowrap}
.st.good{color:var(--good-ink)} .st.warn{color:var(--warn-ink)} .st.crit{color:var(--crit-ink)}
.tip{position:fixed;pointer-events:none;z-index:60;background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12.5px;display:none;max-width:280px;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:3px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-bottom:8px}
.legend .dash{display:inline-block;width:16px;border-top:2px dashed var(--muted);vertical-align:3px;margin-right:6px}
.legend .solid{display:inline-block;width:16px;border-top:2px solid;vertical-align:3px;margin-right:6px}
.chart{min-height:40px;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.hit{fill:transparent;cursor:default}
.hit:hover{fill:var(--text);fill-opacity:.04}
.hrow{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto;gap:10px;align-items:center;padding:4px 0;font-size:13px}
.hrow .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.hrow .ht{height:14px}
.hrow .hf{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hrow .hv{font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.hrow:hover .hl{color:var(--text)}
.prog{padding:8px 0}
.prog+.prog{border-top:1px solid var(--border)}
.prog .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:13px;flex-wrap:wrap}
dialog{border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);padding:0;width:min(460px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .dh{padding:16px 18px 4px} dialog .dh h3{margin:0;font-size:16px}
dialog .db{padding:10px 18px;max-height:65vh;overflow:auto}
dialog .df{padding:12px 18px 16px;display:flex;justify-content:flex-end;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld>span{font-size:12.5px;color:var(--text-2);font-weight:550}
.fld.inline{flex-direction:row;align-items:center;gap:8px;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:4px 14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);display:none;align-items:center;gap:12px;z-index:70;max-width:calc(100vw - 32px);font-size:13.5px}
#toast button{background:none;border:0;color:inherit;font:inherit;font-weight:650;text-decoration:underline;cursor:pointer;padding:0}
.empty{text-align:center;padding:28px 16px;color:var(--text-2)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 11px;color:var(--text-2);cursor:pointer;font:inherit;font-weight:550}
.seg button.on{background:var(--accent);color:#fff}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.welcome{max-width:640px;margin:24px auto;padding:28px}
.welcome h2{font-size:20px}
.welcome ol{padding-left:20px;color:var(--text-2)} .welcome li{margin:6px 0}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.goals .card{margin:0}
.big{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
pre.raw{max-height:260px;overflow:auto;background:var(--surface-2);padding:10px;border-radius:8px;font-size:11.5px;white-space:pre}
details summary{cursor:pointer;color:var(--text-2);font-size:13px}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--surface-2);font-size:11.5px;color:var(--text-2);font-weight:550}
.warnbox{border-left:3px solid var(--warn);background:var(--surface-2);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
td input[type=number]{width:96px;text-align:right}
dialog.wide{width:min(860px,calc(100vw - 32px))}
.rview img{max-width:100%;border-radius:8px;border:1px solid var(--border)}
.rview iframe{width:100%;height:60vh;border:1px solid var(--border);border-radius:8px;background:#fff}
.rq{border-top:1px solid var(--border);padding:14px 0 10px}
.rq:first-of-type{border-top:0}
textarea{width:100%;resize:vertical}
td input.desc{width:100%;min-width:160px}
@media (max-width:640px){ .hide-sm{display:none} .kpi .v{font-size:19px} .mnav b{min-width:100px} }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <h1>Finance Tracker</h1>
      <span class="spacer"></span><span id="fsStat" class="small"></span>
      <button class="btn ghost sm" id="themeBtn" onclick="cycleTheme()" title="Switch light / dark"></button>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main id="view"></main>
<div class="tip" id="tip"></div>
<div id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>
<dialog id="dlg"></dialog>

<script>
/* ---------- basics ---------- */
const KEY='fintrack.v1';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,'0');
const round2=n=>Math.round(n*100)/100;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const curMonth=()=>today().slice(0,7);
function addMonths(ym,n){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function monthEnd(ym){const[y,m]=ym.split('-').map(Number);return `${ym}-${pad(new Date(y,m,0).getDate())}`}
function monthsBetween(a,b){const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)}
function mLabel(ym,long){const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,long?{month:'long',year:'numeric'}:{month:'short',year:'2-digit'})}
function dLabel(d){if(!d)return '';const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
const _nf={};
function nf(key,opts){return _nf[key+S.settings.currency]||(_nf[key+S.settings.currency]=new Intl.NumberFormat(undefined,{style:'currency',currency:S.settings.currency||'USD',...opts}))}
const money=(n,cents=true)=>nf(cents?'c':'w',cents?{}:{maximumFractionDigits:0,minimumFractionDigits:0}).format(n||0);
const moneyShort=n=>nf('s',{notation:'compact',maximumFractionDigits:1}).format(n||0);

const ACCT_TYPES={checking:['Checking','asset'],savings:['Savings','asset'],cash:['Cash','asset'],investment:['Investment / retirement','asset'],property:['Property / vehicle','asset'],otherAsset:['Other asset','asset'],credit:['Credit card','debt'],loan:['Loan','debt'],mortgage:['Mortgage','debt'],otherDebt:['Other debt','debt']};
const isDebt=a=>ACCT_TYPES[a.type]?.[1]==='debt';
const TYPE_LABEL={expense:'Spending',income:'Income',transfer:'Transfers (not counted as spending)'};
const DEFAULT_CATS=[
  ...['Paycheck','Other Income','Interest & Dividends','Refunds'].map(n=>({name:n,type:'income'})),
  ...['Housing','Utilities','Groceries','Dining Out','Transportation','Gas','Insurance','Healthcare','Debt Interest & Fees','Subscriptions','Shopping','Entertainment','Personal Care','Kids','Pets','Gifts & Donations','Travel','Education','Bank Fees','Misc','Uncategorized'].map(n=>({name:n,type:'expense'})),
  ...['Transfer','Debt Payment','Savings Contribution'].map(n=>({name:n,type:'transfer'}))];
const DEFAULT_RULES=[['payroll','Paycheck'],['direct dep','Paycheck'],['payment thank you','Debt Payment'],['autopay','Debt Payment'],['interest charge','Debt Interest & Fees'],['late fee','Debt Interest & Fees'],['transfer','Transfer'],['netflix','Subscriptions'],['spotify','Subscriptions'],['hulu','Subscriptions'],['uber eats','Dining Out'],['doordash','Dining Out'],['uber','Transportation'],['lyft','Transportation'],['shell','Gas'],['exxon','Gas'],['chevron','Gas'],['kroger','Groceries'],['aldi','Groceries'],['publix','Groceries'],['trader joe','Groceries'],['starbucks','Dining Out'],['mcdonald','Dining Out'],['chipotle','Dining Out'],['amazon','Shopping'],['target','Shopping'],['cvs','Healthcare'],['walgreens','Healthcare']].map(([m,c])=>({id:uid(),match:m,category:c}));

// Added later; merged into existing saves once (rulesVersion) so deleted rules don't come back.
const RULES_V2=[['auto pymt','Debt Payment'],['cc pymt','Debt Payment'],['crd autopay','Debt Payment'],['card pymt','Debt Payment'],['transfer to sav','Savings Contribution'],['costco','Groceries'],['safeway','Groceries'],['circle k','Gas'],['e-zpass','Transportation'],['chick-fil-a','Dining Out'],['wendy\'s','Dining Out'],['arbys','Dining Out'],['dairy queen','Dining Out'],['taco bell','Dining Out'],['dutch bros','Dining Out'],['sonic drive','Dining Out'],['bowlero','Entertainment'],['dave & buster','Entertainment'],['duke energy','Utilities'],['con edison','Utilities'],['pg&e','Utilities'],['xcel energy','Utilities'],['national grid','Utilities'],['adt','Utilities'],['linkedin','Subscriptions'],['disney plus','Subscriptions'],['apple.com/bill','Subscriptions'],['school','Kids'],['ace hardware','Shopping'],['wal-mart','Shopping'],['walmart','Shopping']];
function blank(){return migrate({version:1,accounts:[],transactions:[],receipts:[],categories:DEFAULT_CATS.map(c=>({...c})),budgets:{},goals:[],rules:[...DEFAULT_RULES.map(r=>({...r})),...RULES_V2.map(([m,c])=>({id:uid(),match:m,category:c,...(m==='circle k'?{min:40}:{})})),{id:uid(),match:'circle k',category:'Dining Out'}],rulesVersion:3,debtPlan:{strategy:'avalanche',extra:0},settings:{currency:'USD',theme:'auto',dateFmt:'MDY'},lastBackup:null,importMaps:{},notRecurring:[],demo:false})}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=migrate(JSON.parse(raw));const b=blank();return {...b,...d,settings:{...b.settings,...(d.settings||{})},debtPlan:{...b.debtPlan,...(d.debtPlan||{})}}}}catch(e){}return blank()}
let saveWarned=false;
function save(){S.savedAt=new Date().toISOString();queueFileSave();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveWarned){saveWarned=true;toast('This browser is blocking storage — download a backup in Settings so nothing is lost.')}}}
function migrate(d){
  if(!d||!Array.isArray(d.rules))return d;let v=d.rulesVersion||1;
  if(v<2){const have=new Set(d.rules.map(r=>r.match.toLowerCase()));RULES_V2.forEach(([m,c])=>{if(!have.has(m))d.rules.push({id:uid(),match:m,category:c})});v=2}
  if(v<3){const i=d.rules.findIndex(r=>r.match.toLowerCase()==='circle k'&&r.category==='Gas'&&r.min==null);if(i>=0){d.rules[i].min=40;d.rules.splice(i+1,0,{id:uid(),match:'circle k',category:'Dining Out'})}v=3}
  if(v<4){ // soda shops get their own category
    const C='Drinks & Treats',shops=['dutch bros','sonic drive','jamba','smoothie king','boba','soda shop'];
    if(Array.isArray(d.categories)&&!d.categories.some(c=>c.name===C))d.categories.push({name:C,type:'expense'});
    shops.forEach(m=>{const r=d.rules.find(r=>r.match.toLowerCase()===m);if(r)r.category=C;else d.rules.push({id:uid(),match:m,category:C})});
    const i=d.rules.findIndex(r=>r.match.toLowerCase()==='dutch bros');if(i>0){const moved=d.rules.filter(r=>shops.includes(r.match.toLowerCase()));d.rules=[...moved,...d.rules.filter(r=>!moved.includes(r))]}
    (d.transactions||[]).forEach(t=>{if(!t.splits&&(t.category==='Dining Out'||t.category==='Uncategorized')&&shops.some(m=>(t.desc||'').toLowerCase().includes(m)))t.category=C});
    v=4}
  if(v<5){ // card/loan payments that were imported as income
    const debtIds=new Set((d.accounts||[]).filter(a=>ACCT_TYPES[a.type]?.[1]==='debt').map(a=>a.id)),inc=new Set((d.categories||[]).filter(c=>c.type==='income').map(c=>c.name));
    (d.transactions||[]).forEach(t=>{if(debtIds.has(t.accountId)&&t.amount>0&&!t.splits&&(inc.has(t.category)||t.category==='Uncategorized'))t.category=/\b(return|refund|reversal)\b/i.test(t.desc||'')?'Refunds':'Debt Payment'});
    v=5}
  d.rulesVersion=v;return d}
let S=load();
const UI={tab:'dashboard',month:curMonth(),tf:{q:'',cat:'',acct:'',month:''},txLimit:300,imp:null,impAcct:'',charts:[],allBudgets:false};

/* ---------- derived data ---------- */
function catType(name){const c=S.categories.find(c=>c.name===name);return c?c.type:'expense'}
function catTypeMap(){return new Map(S.categories.map(c=>[c.name,c.type]))}
function monthStats(ym){
  const CT=catTypeMap();let income=0,spend=0;const byCat={};
  for(const t of S.transactions){if(t.date.slice(0,7)!==ym)continue;for(const p of parts(t)){const ty=CT.get(p.category)||'expense';
    if(ty==='income')income+=p.amount;else if(ty==='expense'){spend-=p.amount;byCat[p.category]=(byCat[p.category]||0)-p.amount}}}
  return {income:round2(income),spend:round2(spend),byCat};
}
// Balance = last recorded balance on or before asOf, plus the account's transactions dated after it.
// Debts store the amount owed, so spending (negative) raises it and payments (positive) lower it.
function acctBal(a,asOf){const s=a.snapshots||[];let v=0,base='';for(const x of s){if(!asOf||x.date<=asOf){v=x.balance;base=x.date}}
  const sign=isDebt(a)?-1:1;for(const t of S.transactions){if(t.accountId===a.id&&t.date>base&&(!asOf||t.date<=asOf))v+=sign*t.amount}return round2(v)}
function acctTxSince(a){const ls=lastSnap(a),base=ls?ls.date:'';return S.transactions.filter(t=>t.accountId===a.id&&t.date>base)}
function moveTxForm(){const list=filteredTx();if(!list.length)return toast('No transactions to move.');
  openForm({title:`Move ${list.length} transaction${list.length>1?'s':''} to an account`,fields:[{name:'acct',label:'Account',type:'select',value:'',options:[['','— None —'],...S.accounts.map(a=>[a.id,a.name])]}],
    extra:`<p class="small muted">This moves every transaction currently shown (${list.length}) based on your filters above. Filter first — for example by month and search text — to pick the right ones.</p>`,
    submit:'Move',onSubmit(v){list.forEach(t=>t.accountId=v.acct);save();render();toast(`Moved ${list.length} transactions`)}})}
function lastSnap(a){const s=a.snapshots||[];return s[s.length-1]}
function addSnapshot(id,date,bal){const a=S.accounts.find(x=>x.id===id);if(!a||!isFinite(bal))return;a.snapshots=(a.snapshots||[]).filter(s=>s.date!==date);a.snapshots.push({date,balance:round2(bal)});a.snapshots.sort((x,y)=>x.date.localeCompare(y.date))}
function totals(asOf){let assets=0,debts=0;for(const a of S.accounts){const b=acctBal(a,asOf);if(isDebt(a))debts+=b;else assets+=b}return {assets,debts,net:assets-debts}}
// A rule matches when the description contains its text and, if set, the amount is at least min and under max.
function ruleFor(desc,amount){const d=(desc||'').toLowerCase(),a=Math.abs(amount||0);return S.rules.find(r=>r.match&&d.includes(r.match.toLowerCase())&&(r.min==null||r.min===''||a>=r.min)&&(r.max==null||r.max===''||a<r.max))}
function categorize(desc,amount){const r=ruleFor(desc,amount);return r?r.category:amount>0?'Other Income':'Uncategorized'}
// A split transaction divides its amount across categories: t.splits=[{category,amount}], signed like t.amount.
const parts=t=>t.splits&&t.splits.length?t.splits:[{category:t.category,amount:t.amount}];
function applySplit(t,ps){const sign=t.amount<0?-1:1;ps=ps.filter(p=>p.amount>0);if(ps.length<2){delete t.splits;if(ps[0])t.category=ps[0].category;return}
  t.splits=ps.map(p=>({category:p.category,amount:round2(sign*p.amount)}));t.category=[...ps].sort((a,b)=>b.amount-a.amount)[0].category}
const dupKey=t=>t.date+'|'+(+t.amount).toFixed(2);

function acctSelect(attrs,value,none){return `<select ${attrs}>${none?`<option value="">${esc(none)}</option>`:''}${S.accounts.map(a=>`<option value="${a.id}" ${a.id===value?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`}

function shiftMonth(n){UI.month=addMonths(UI.month,n);render()}
function kpi(l,v,s){return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`}
function budgetStatus(p){if(p>1)return ['crit','✕','Over'];if(p>=.85)return ['warn','▲','Close'];return ['good','●','On track']}

function openForm({title,fields,submit='Save',onSubmit,extra='',noCancel,wide}){
  const d=$('#dlg');d.classList.toggle('wide',!!wide);
  d.innerHTML=`<form novalidate><div class="dh"><h3>${esc(title)}</h3></div><div class="db">${fields.map(fieldHTML).join('')}${extra}</div><div class="df">${noCancel?'':`<button type="button" class="btn" onclick="$('#dlg').close()">Cancel</button>`}<button class="btn primary">${esc(submit)}</button></div></form>`;
  const form=$('form',d);
  form.onsubmit=e=>{e.preventDefault();
    for(const f of fields){const el=form.elements[f.name];if(f.required&&!String(el.value).trim()){el.focus();return}}
    const v={};fields.forEach(f=>{const el=form.elements[f.name];v[f.name]=f.type==='number'?parseFloat(el.value):el.value});
    if(onSubmit(v)!==false)d.close()};
  d.showModal();const first=form.querySelector('.db input,.db select');first&&first.focus();
}
function fieldHTML(f){
  const at=`name="${f.name}" ${f.required?'required':''}`;let c;
  if(f.type==='select')c=`<select ${at}>${f.options.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(f.value??'')?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
  else if(f.type==='catselect')c=catSelect(at,f.value);
  else if(f.type==='textarea')c=`<textarea ${at} rows="${f.rows||8}" placeholder="${esc(f.placeholder||'')}">${esc(f.value??'')}</textarea>`;
  else c=`<input type="${f.type||'text'}" ${at} value="${esc(f.value??'')}" ${f.type==='number'?`step="${f.step||'0.01'}" inputmode="decimal"`:''} ${f.min!=null?`min="${f.min}"`:''} placeholder="${esc(f.placeholder||'')}">`;
  return `<label class="fld"><span>${esc(f.label)}</span>${c}${f.hint?`<small class="muted">${esc(f.hint)}</small>`:''}</label>`;
}

/* ---------- charts ---------- */
function niceStep(x){const p=10**Math.floor(Math.log10(x));const n=x/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function ticks(min,max,count=4){if(max-min<1e-9)max=min+1;const st=niceStep((max-min)/count);const lo=Math.floor(min/st)*st,hi=Math.ceil(max/st)*st;const t=[];for(let v=lo;v<=hi+st/2;v+=st)t.push(Math.round(v*1e6)/1e6);return {lo,hi,t}}
function axisY(t,y,m,W){return t.t.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'var(--muted)':'var(--grid)'}" stroke-width="1" ${v===0?'stroke-opacity=".5"':''}/><text x="${m.l-8}" y="${y(v)+3.5}" text-anchor="end">${esc(moneyShort(v))}</text>`).join('')}
function vbar(x,y0,w,h,r){if(h<=.5)return '';r=Math.min(r,w/2,h);const yt=y0-h;return `M${x},${y0}V${yt+r}Q${x},${yt} ${x+r},${yt}H${x+w-r}Q${x+w},${yt} ${x+w},${yt+r}V${y0}Z`}
function legendHTML(series){return series.length<2?'':`<div class="legend">${series.map(s=>s.dash?`<span><i class="dash"></i>${esc(s.name)}</span>`:(s.line?`<span><i class="solid" style="border-color:${s.color}"></i>${esc(s.name)}</span>`:`<span><i class="sw" style="background:${s.color}"></i>${esc(s.name)}</span>`)).join('')}</div>`}
function tipRows(title,series,i){return `<b>${esc(title)}</b>`+series.map(s=>`<div>${s.dash?'<i class="dash" style="display:inline-block;width:10px;border-top:2px dashed var(--muted);vertical-align:3px;margin-right:6px"></i>':`<i class="sw" style="background:${s.color}"></i>`}${esc(s.name)}: ${esc(money(s.values[i]))}</div>`).join('')}

function barChart(el,labels,series){
  if(!el)return;const W=Math.max(260,el.clientWidth),H=230,m={t:10,r:6,b:26,l:50},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const max=Math.max(1,...series.flatMap(s=>s.values));const t=ticks(0,max);const y=v=>m.t+ih-(v-t.lo)/(t.hi-t.lo)*ih;
  const n=series.length,gw=iw/labels.length,bw=Math.max(4,Math.min(28,(gw*.7-2*(n-1))/n)),tot=bw*n+2*(n-1);
  let out=axisY(t,y,m,W);const every=Math.ceil(labels.length/Math.max(1,Math.floor(iw/58)));
  labels.forEach((lab,i)=>{const gx=m.l+gw*i+(gw-tot)/2;
    series.forEach((s,j)=>{out+=`<path d="${vbar(gx+j*(bw+2),y(0),bw,y(0)-y(Math.max(0,s.values[i])),4)}" fill="${s.color}"/>`});
    if(i%every===0)out+=`<text x="${m.l+gw*i+gw/2}" y="${H-7}" text-anchor="middle">${esc(lab)}</text>`;
    out+=`<rect class="hit" x="${m.l+gw*i}" y="${m.t}" width="${gw}" height="${ih}" data-tip="${esc(tipRows(lab,series,i))}"/>`});
  el.innerHTML=legendHTML(series)+`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(' and '))} by month">${out}</svg>`;
}
function lineChart(el,labels,series,H=220){
  if(!el)return;const W=Math.max(260,el.clientWidth),m={t:12,r:10,b:26,l:54},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=series.flatMap(s=>s.values);const t=ticks(Math.min(0,...all),Math.max(1,...all));const y=v=>m.t+ih-(v-t.lo)/(t.hi-t.lo)*ih;
  const N=labels.length,x=i=>N===1?m.l+iw/2:m.l+i*iw/(N-1);
  let out=axisY(t,y,m,W);const every=Math.ceil(N/Math.max(1,Math.floor(iw/64)));
  labels.forEach((l,i)=>{if(i%every===0)out+=`<text x="${x(i)}" y="${H-7}" text-anchor="${i===0&&N>1?'start':'middle'}">${esc(l)}</text>`});
  series.forEach(s=>{out+=`<path d="${s.values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join('')}" fill="none" stroke="${s.dash?'var(--muted)':s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    if(!s.dash){const i=N-1;out+=`<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`}});
  out+=`<g class="guide" style="opacity:0;pointer-events:none"><line y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" stroke-width="1"/>${series.map(s=>`<circle r="4.5" fill="${s.dash?'var(--muted)':s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('')}</g>`;
  const hw=N===1?iw:iw/(N-1);
  labels.forEach((l,i)=>{out+=`<rect class="hit" style="fill-opacity:0" x="${Math.max(m.l,x(i)-hw/2)}" y="${m.t}" width="${hw}" height="${ih}" data-i="${i}" data-tip="${esc(tipRows(l,series,i))}"/>`});
  el.innerHTML=legendHTML(series)+`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(' and '))} over time">${out}</svg>`;
  el._line={x:labels.map((_,i)=>x(i)),ys:series.map(s=>s.values.map(y))};
}
function hoverLine(hit){const el=hit.closest('.chart');if(!el||!el._line)return;const g=$('.guide',el),i=+hit.dataset.i,L=el._line;g.style.opacity=1;const ln=$('line',g);ln.setAttribute('x1',L.x[i]);ln.setAttribute('x2',L.x[i]);$$('circle',g).forEach((c,k)=>{c.setAttribute('cx',L.x[i]);c.setAttribute('cy',L.ys[k][i])})}
(function tips(){const tip=$('#tip');
  document.addEventListener('mouseover',e=>{const t=e.target.closest?.('[data-tip]');if(!t){tip.style.display='none';$$('.guide').forEach(g=>g.style.opacity=0);return}tip.innerHTML=t.dataset.tip;tip.style.display='block';if(t.dataset.i!=null)hoverLine(t)});
  document.addEventListener('mousemove',e=>{if(tip.style.display!=='block')return;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'});
  document.addEventListener('scroll',()=>tip.style.display='none',true);})();

const TABS=[['dashboard','Dashboard'],['insights','Insights'],['transactions','Transactions'],['budgets','Budgets'],['accounts','Accounts'],['debts','Debt payoff'],['goals','Savings goals'],['import','Import'],['receipts','Receipts'],['settings','Settings']];

let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>UI.charts.forEach(f=>f()),150)});
function applyTheme(){const t=S.settings.theme;if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}
function cycleTheme(){S.settings.theme={auto:'light',light:'dark',dark:'auto'}[S.settings.theme];applyTheme();save();render()}
function banner(){
  if(FS.state==='prompt')return `<div class="banner"><span>▲ Click to reconnect your data file <b>${esc(FS.name)}</b>. Chrome asks once each time you open the tracker. Until then, changes are only saved in the browser.</span><span class="spacer"></span><button class="btn sm primary" onclick="fsReconnect()">Reconnect</button></div>`;
  if(FS.state==='ok')return S.demo?`<div class="banner"><span>You're looking at <b>demo data</b>.</span><span class="spacer"></span><button class="btn sm" onclick="eraseAll(true)">Clear demo data</button></div>`:'';
  if(S.demo)return `<div class="banner"><span>You're looking at <b>demo data</b>. When you're ready to start for real, clear it and add your own accounts.</span><span class="spacer"></span><button class="btn sm" onclick="eraseAll(true)">Clear demo data</button></div>`;

}

  ${kpi('Net worth',money(T.net,false),`Assets ${money(T.assets,false)} · Debts ${money(T.debts,false)}`)}</div>`;
  const months=[...Array(6)].map((_,i)=>addMonths(ym,i-5)),ms=months.map(monthStats);

  let cats=Object.entries(st.byCat).filter(([,v])=>v>0.005).sort((a,b)=>b[1]-a[1]);

  h+=`<div class="grid g2" style="margin-bottom:16px"><div class="card"><h2>Budgets<span class="sub">most used first</span></h2>${bud.length?bud.map(x=>progRow(x.c,x.s,x.b,true)).join(''):`<div class="empty">No budgets yet. <a href="#" onclick="go('budgets');return false">Set some up</a></div>`}</div>

function progRow(name,val,target,isBudget){
  const p=target>0?val/target:0;
  if(isBudget){const[k,ic,lab]=budgetStatus(p);return `<div class="prog"><div class="top"><span>${esc(name)}</span><span class="t2">${money(val,false)} of ${money(target,false)} <span class="st ${k}">${ic} ${lab}</span></span></div><div class="track"><div class="fill ${k}" style="width:${Math.min(100,p*100)}%"></div></div></div>`}
  return `<div class="prog"><div class="top"><span>${esc(name)}</span><span class="t2">${money(val,false)} of ${money(target,false)} · ${Math.round(p*100)}%</span></div><div class="track"><div class="fill" style="width:${Math.min(100,p*100)}%"></div></div></div>`;
}
function nwChart(el){
  const firsts=S.accounts.map(a=>a.snapshots?.[0]?.date).filter(Boolean).sort();
  const cm=curMonth();let start=addMonths(cm,-11);if(firsts[0]&&firsts[0].slice(0,7)>start)start=firsts[0].slice(0,7);
  const months=[];for(let m=start;m<=cm;m=addMonths(m,1))months.push(m);
  const vals=months.map(m=>totals(m===cm?today():monthEnd(m)).net);
  lineChart(el,months.map(m=>mLabel(m)),[{name:'Net worth',color:'var(--s1)',values:vals}]);
}

function filteredTx(){const f=UI.tf,q=f.q.toLowerCase();return S.transactions.filter(t=>(!f.month||t.date.startsWith(f.month))&&(!f.cat||t.category===f.cat||t.splits?.some(p=>p.category===f.cat))&&(!f.acct||t.accountId===f.acct)&&(!q||(t.desc+' '+(t.note||'')+' '+(t.raw||'')).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date))}
function renderTxTable(){
  const el=$('#txTable');if(!el)return;const list=filteredTx(),shown=list.slice(0,UI.txLimit),CT=catTypeMap();
  let inn=0,out=0;list.forEach(t=>parts(t).forEach(p=>{if(CT.get(p.category)==='transfer')return;p.amount>0?inn+=p.amount:out-=p.amount}));

/* ---------- Debt payoff ---------- */
function simulate(debts,extra,strategy,rollover){
  const ds=debts.map(d=>({...d,bal:d.balance})),minTotal=ds.reduce((a,d)=>a+d.minPayment,0);
  const tot=[ds.reduce((a,d)=>a+d.bal,0)];let interest=0,mo=0;const payoff={};
  while(ds.some(d=>d.bal>0.005)&&mo<600){mo++;
    ds.forEach(d=>{if(d.bal>0){const i=d.bal*d.apr/1200;d.bal+=i;interest+=i}});
    let budget=(rollover?minTotal:ds.filter(d=>d.bal>0).reduce((a,d)=>a+d.minPayment,0))+extra;
    ds.forEach(d=>{if(d.bal>0){const p=Math.min(d.minPayment,d.bal,budget);d.bal-=p;budget-=p}});
    const order=ds.filter(d=>d.bal>0.005).sort(strategy==='snowball'?(a,b)=>a.bal-b.bal:(a,b)=>b.apr-a.apr||a.bal-b.bal);
    for(const d of order){if(budget<=0.005)break;const p=Math.min(budget,d.bal);d.bal-=p;budget-=p}
    ds.forEach(d=>{if(d.bal<=0.005&&!payoff[d.id]){d.bal=0;payoff[d.id]=mo}});
    tot.push(round2(ds.reduce((a,d)=>a+Math.max(0,d.bal),0)))}
  return {months:mo,interest,payoff,totals:tot,stuck:ds.some(d=>d.bal>0.005)};
}
function vDebts(){

  if(!debts.length)return `<div class="card"><div class="empty"><p>No debts with a balance yet.</p><p class="small">Add your credit cards and loans with their balance, interest rate and minimum payment, and a payoff plan appears here.</p></div></div>${existingDebtCard(true)}`;
  const P=S.debtPlan,extra=+P.extra||0,plan=simulate(debts,extra,P.strategy,true),base=simulate(debts,0,'avalanche',false);
  const total=debts.reduce((a,d)=>a+d.balance,0),monthly=debts.reduce((a,d)=>a+d.minPayment,0)+extra,cm=curMonth();
  const saved=base.interest-plan.interest,sooner=base.months-plan.months;

  return `<div class="card"><div class="toolbar" style="margin:0"><span class="t2">Strategy</span><div class="seg"><button class="${P.strategy==='avalanche'?'on':''}" onclick="setPlan('strategy','avalanche')">Avalanche</button><button class="${P.strategy==='snowball'?'on':''}" onclick="setPlan('strategy','snowball')">Snowball</button></div>
  <label class="fld inline"><span class="t2">Extra each month</span><input type="number" min="0" step="25" value="${extra||''}" placeholder="0" onchange="setPlan('extra',parseFloat(this.value)||0)" style="width:110px"></label></div>
  <p class="small muted" style="margin:10px 0 0">${P.strategy==='avalanche'?'Avalanche: extra money goes to the highest interest rate first — least interest paid overall.':'Snowball: extra money goes to the smallest balance first — quicker wins to keep you motivated.'} When a debt is paid off, its minimum rolls into the next one.</p></div>
  ${plan.stuck?`<div class="warnbox">▲ At these payments some debt never gets paid off — a minimum payment is lower than the interest it's charged. Raise that minimum or add extra.</div>`:''}
  <div class="kpis">${kpi('Total debt',money(total,false))}${kpi('Paying each month',money(monthly,false),`${money(extra,false)} extra`)}
  ${kpi('Debt-free by',plan.stuck?'—':mLabel(addMonths(cm,plan.months),true),plan.stuck?'':`${plan.months} months`)}${kpi('Interest you\'ll pay',plan.stuck?'<span class="st crit" style="font-size:16px">✕ Never paid off</span>':money(plan.interest,false),plan.stuck?'Raise a minimum or add extra each month':base.stuck?'Minimums alone never finish':saved>1?`${money(saved,false)} less than minimums only${sooner>0?`, ${sooner} months sooner`:''}`:'')}</div>
  <div class="card"><h2>Payoff order</h2><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Debt</th><th class="num">Owed</th><th class="num">APR %</th><th class="num">Min payment</th><th>Paid off</th><th></th></tr></thead><tbody>
  ${ordered.map((d,i)=>`<tr><td class="t2">${i+1}</td><td>${esc(d.name)}</td><td class="num">${money(d.balance,false)}</td><td class="num"><input type="number" step="0.01" min="0" value="${d.apr}" onchange="setAcct('${d.id}','apr',this.value)" aria-label="APR"></td><td class="num"><input type="number" step="1" min="0" value="${d.minPayment}" onchange="setAcct('${d.id}','minPayment',this.value)" aria-label="Minimum payment"></td><td class="nowrap">${plan.payoff[d.id]?mLabel(addMonths(cm,plan.payoff[d.id]),true):'<span class="st crit">✕ Never</span>'}</td><td><button class="btn sm" onclick="payForm('${d.id}')">Record payment</button></td></tr>`).join('')}
  </tbody></table></div></div>
  ${existingDebtCard(false)}
  ${debtFlowCards(cm)}
  <div class="card"><h2>Total debt over time</h2><div class="chart" id="c-debt"></div></div>`;

// Accounts that aren't in the payoff plan yet: debt accounts with no balance, and (tucked away) other accounts in case one is really a card.
function existingDebtCard(empty){
  const inPlan=a=>isDebt(a)&&acctBal(a)>0,debtNoBal=S.accounts.filter(a=>isDebt(a)&&!inPlan(a)),others=S.accounts.filter(a=>!isDebt(a));
  const row=a=>`<tr><td>${esc(a.name)}<div class="small muted">${ACCT_TYPES[a.type]?.[0]||''}${isDebt(a)?' · no balance owed yet':` · ${money(acctBal(a))}`}</div></td><td style="text-align:right"><button class="btn sm ${isDebt(a)?'primary':''}" onclick="includeDebtForm('${a.id}')">Add to plan</button></td></tr>`;
  if(!debtNoBal.length&&!others.length&&!empty)return '';

const RAMT=/(?:^|[^\d.,])(-?\$?\s?(?:\d{1,3}(?:,\d{3})+|\d+)\.\d{2})(?!\d)/g;

const ITEM_SKIP=/total|\btax\b|tender|amount|\bamt\b|change|balance|points|disc(ount)?\b|ppg|visa|master|amex|debit|credit|nitro|\bcard\b|auth|saving|saved|coupon|gallons?|pump|invoice|sequence|payment|\bcash\b|items sold|\bqty\b|shipping|delivery fee|tip\b/i;

function parseReceipt(text,meta={}){

    const sc=/grand total|order total|total charged|amount charged|amount paid|total paid|you paid|payment total|total amount|charged to|transaction total|purchase total/.test(L)?3:/\btotal\b/.test(L)?2:/amount due|balance due|\bpaid\b|charged|\bamount\b/.test(L)?1:0;

function receiptCandidates(total,date,exceptRid){

/* ---------- Insights: recurring payments + spending trends ---------- */
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};

function merchKey(d){return (d||'').toLowerCase().replace(/^(pos|debit card purchase|debit purchase|purchase|recurring payment|preauthorized debit|ach (debit|credit)|ach|checkcard|visa)\s+/,'').replace(/\b(sq|tst|pp|paypal|sp)\s?\*/g,' ').replace(/[^a-z& ]+/g,' ').replace(/\b(www|com|inc|llc|usa|us|co)\b/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ')}
function prettyName(descs){const c={};descs.forEach(d=>{const k=d.replace(/\s*[#*]?\d[\d\-\/]*\s*$/,'').trim()||d;c[k]=(c[k]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]}

function findRecurring(){

  for(const t of S.transactions){const k=merchKey(t.desc);if(k.length<3)continue;const key=k+(t.amount>0?'+':'-');if(!ignore.has(key))(groups[key]=groups[key]||[]).push(t)}

    const iv=dates.slice(1).map((d,i)=>dayDiff(d,dates[i])),cad=CADENCES.find(c=>{const m=median(iv);return m>=c[2]&&m<=c[3]});if(!cad)continue;
    const amts=dates.map(d=>Math.abs(byDate[d])),mean=amts.reduce((a,b)=>a+b,0)/amts.length,sd=Math.sqrt(amts.reduce((a,b)=>a+(b-mean)**2,0)/amts.length),stable=mean>0&&sd/mean<.12;

  const odd=S.transactions.filter(t=>t.amount<0&&t.date>=since&&(CT.get(t.category)||'expense')==='expense'&&t.category!=='Housing'&&-t.amount>=75&&(byCat[t.category]||[]).length>=4&&-t.amount>3*median(byCat[t.category])).sort((a,b)=>a.amount-b.amount).slice(0,6);
  // top merchants 90 days
  const tm={};S.transactions.forEach(t=>{if(t.amount<0&&t.date>=addDays(td,-90)&&(CT.get(t.category)||'expense')==='expense'){const k=merchKey(t.desc);if(!k)return;(tm[k]=tm[k]||{d:[],v:0,n:0});tm[k].d.push(t.desc);tm[k].v-=t.amount;tm[k].n++}});
  const top=Object.values(tm).sort((a,b)=>b.v-a.v).slice(0,8);
  // recurring
  const R=findRecurring(),act=R.filter(r=>!r.stopped),inc=act.filter(r=>r.kind==='income'),bills=act.filter(r=>r.kind==='bill'),trans=act.filter(r=>r.kind==='transfer'),habits=act.filter(r=>r.kind==='habit'),stopped=R.filter(r=>r.stopped&&r.kind!=='habit');
  const sum=a=>a.reduce((s,r)=>s+r.perMonth,0),subs=bills.filter(r=>r.cat==='Subscriptions'),left=sum(inc)-sum(bills)-sum(trans);
  const recTable=(list,showNext=true)=>`<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>How often</th><th class="num">Usually</th><th class="num hide-sm">Per month</th><th class="hide-sm">Last</th>${showNext?'<th>Next</th>':''}<th></th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.name)}<div class="small muted">${esc(r.cat)} · seen ${r.count}×${r.change?` · <span class="st ${r.change.to>r.change.from?'warn':'good'}">${r.change.to>r.change.from?'▲ went up':'▼ went down'} from ${money(r.change.from)} to ${money(r.change.to)}</span>`:''}</div></td><td class="small nowrap">${r.cadence}</td><td class="num">${money(r.typical)}${r.stable?'':'<div class="small muted">varies</div>'}</td><td class="num hide-sm">${money(r.perMonth,false)}</td><td class="small t2 hide-sm nowrap">${dLabel(r.last)}</td>${showNext?`<td class="small nowrap">${r.next<td?'Any day now':dLabel(r.next)}</td>`:''}<td><button class="btn ghost sm" onclick="notRecurring('${esc(r.key)}')" title="This isn't a recurring payment" aria-label="Not recurring">✕</button></td></tr>`).join('')}</tbody></table></div>`;
  const up=upcoming(R,30);
  return `<div class="kpis">${kpi('Spent so far this month',money(now,false),then?`${diff>=0?'▲':'▼'} ${money(Math.abs(diff),false)} ${diff>=0?'more':'less'} than by day ${dayN} last month`:'')}
  ${kpi('Regular income',money(sum(inc),false)+'<span class="small muted" style="font-weight:400"> /mo</span>',`${inc.length} source${inc.length===1?'':'s'}`)}
  ${kpi('Bills & subscriptions',money(sum(bills),false)+'<span class="small muted" style="font-weight:400"> /mo</span>',subs.length?`${subs.length} subscriptions · ${money(sum(subs)*12,false)}/yr`:'')}
  ${kpi('Left after regular payments',`<span class="${left>=0?'pos':''}">${left<0?'−':''}${money(Math.abs(left),false)}</span>`,'income − bills − debt payments &amp; transfers, per month')}</div>
  <div class="grid g2" style="margin-bottom:16px"><div class="card"><h2>What changed<span class="sub">${mLabel(lm,true)} vs the 3 months before</span></h2>
  ${!hasPrev?'<div class="empty small">Needs a few more months of history.</div>':!ups.length&&!downs.length?'<div class="empty small">No big changes — spending was in line with your usual.</div>':
   [...ups,...downs].map(x=>`<div class="prog"><div class="top"><span>${esc(x.c)}</span><span class="${x.d>0?'st warn':'st good'}">${x.d>0?'▲':'▼'} ${money(Math.abs(x.d),false)} ${x.d>0?'more':'less'}</span></div><div class="small muted">${money(x.v,false)} vs usual ${money(x.avg,false)}</div></div>`).join('')}</div>
  <div class="card"><h2>Coming up<span class="sub">next 30 days</span></h2>${up.length?upcomingTable(up):'<div class="empty small">No recurring payments found yet.</div>'}</div></div>
  <div class="card"><h2>Recurring payments<span class="sub">found automatically · ✕ removes one that isn't really recurring</span></h2>
  ${R.length?`<h3 class="small t2" style="margin:4px 0 6px">Income</h3>${inc.length?recTable(inc):'<p class="small muted">None found.</p>'}
  <h3 class="small t2" style="margin:16px 0 6px">Bills &amp; subscriptions</h3>${bills.length?recTable(bills):'<p class="small muted">None found.</p>'}
  ${trans.length?`<h3 class="small t2" style="margin:16px 0 6px">Debt payments &amp; transfers</h3>${recTable(trans)}<p class="small muted" style="margin:6px 0 0">A card payment can include bills already listed above if you pay them with that card.</p>`:''}
  ${habits.length?`<details style="margin-top:14px"><summary>Regular spending habits (${habits.length}) — ${money(sum(habits),false)}/mo</summary>${recTable(habits,false)}</details>`:''}
  ${stopped.length?`<details style="margin-top:10px"><summary>May have stopped or been cancelled (${stopped.length})</summary>${recTable(stopped,false)}</details>`:''}`
  :'<div class="empty small">Nothing recurring found yet — this needs at least 2–3 months of history.</div>'}</div>
  <div class="card"><h2>Spending by category<span class="sub">last 6 full months · ${mLabel(months[0])} to ${mLabel(months[5])}</span></h2><div class="tbl-wrap"><table><thead><tr><th>Category</th><th>Trend</th><th class="num">Monthly avg</th><th class="num">${mLabel(lm)}</th></tr></thead><tbody>
  ${rows.map(r=>{const avg=r.tot/6,l=r.vals[5];return `<tr data-tip="${esc(`<b>${esc(r.c)}</b>`+months.map((m,i)=>`<div>${mLabel(m)}: ${esc(money(r.vals[i],false))}</div>`).join(''))}"><td>${esc(r.c)}</td><td>${sparkBars(r.vals)}</td><td class="num">${money(avg,false)}</td><td class="num">${money(l,false)}${avg>0&&Math.abs(l-avg)/avg>=.2&&Math.abs(l-avg)>=25?` <span class="st ${l>avg?'warn':'good'}">${l>avg?'▲':'▼'}</span>`:''}</td></tr>`}).join('')}</tbody></table></div></div>
  ${itemsCard()}
  ${wAvg.some(v=>v>0)?`<div class="card"><h2>When you spend<span class="sub">average per day of the week · last 6 months · bills and rent left out</span></h2><p class="small t2" style="margin-top:0">${['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'][wTop]} are your biggest spending day, at about ${money(Math.max(...wAvg),false)} on average.</p><div class="chart" id="c-wd"></div></div>`:''}
  <div class="grid g2"><div class="card"><h2>Where you shop most<span class="sub">last 90 days</span></h2>${top.map(m=>`<div class="hrow"><div class="hl">${esc(prettyName(m.d))}</div><div class="ht"><div class="hf" style="width:${m.v/top[0].v*100}%"></div></div><div class="hv">${money(m.v,false)}<span class="small muted"> · ${m.n}×</span></div></div>`).join('')||'<div class="empty small">No spending in the last 90 days.</div>'}</div>
  <div class="card"><h2>Unusually large charges<span class="sub">last 60 days</span></h2>${odd.length?`<div class="tbl-wrap"><table><tbody>${odd.map(t=>`<tr><td class="small t2 nowrap">${dLabel(t.date)}</td><td>${esc(t.desc)}<div class="small muted">${esc(t.category)} · usually ~${money(median(byCat[t.category]),false)}</div></td><td class="num">${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty small">Nothing out of the ordinary.</div>'}</div></div>`;
}
function itemStats(days){
  const since=addDays(today(),-days),agg={};let n=0;
  for(const r of S.receipts){if(!r.date||r.date<since)continue;const its=receiptItems(r);if(its.length)n++;
    for(const it of its){const k=itemKey(it.name);if(k.length<3)continue;const a=agg[k]||(agg[k]={names:{},qty:0,spent:0,prices:[],stores:new Set()});
      a.names[it.name]=(a.names[it.name]||0)+1;a.qty+=it.qty;a.spent+=it.amount;a.prices.push({d:r.date,p:it.amount/it.qty});a.stores.add(r.merchant)}}
  const rows=Object.entries(agg).map(([k,a])=>{a.prices.sort((x,y)=>x.d.localeCompare(y.d));const f=a.prices[0].p,l=a.prices[a.prices.length-1].p;
    return {k,name:Object.entries(a.names).sort((x,y)=>y[1]-x[1])[0][0],qty:a.qty,spent:round2(a.spent),avg:round2(a.spent/a.qty),stores:[...a.stores],up:a.prices.length>1&&l>f*1.05&&l-f>=.1?{from:f,to:l}:null}}).sort((x,y)=>y.spent-x.spent);
  return {rows,receipts:n,since};
}
function itemsCard(){
  if(!S.receipts.length)return '';
  const days=UI.itemDays||90,{rows,receipts,since}=itemStats(days),q=(UI.itemQ||'').trim(),terms=q.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
  const hit=s=>terms.some(t=>s.toLowerCase().includes(t)),shown=terms.length?rows.filter(r=>hit(r.name)||hit(r.k)):rows.slice(0,15),mo=days/30.44;
  let summary='';
  if(terms.length){
    const withItems=new Set(S.receipts.filter(r=>r.txId&&receiptItems(r).length).map(r=>r.txId)),CT=catTypeMap();
    const tx=S.transactions.filter(t=>t.date>=since&&t.amount<0&&!withItems.has(t.id)&&(CT.get(t.category)||'expense')==='expense'&&hit(t.desc));
    const iSpent=shown.reduce((a,r)=>a+r.spent,0),iQty=shown.reduce((a,r)=>a+r.qty,0),tSpent=tx.reduce((a,t)=>a-t.amount,0),all=iSpent+tSpent;
    summary=`<div class="kpis" style="margin:4px 0 12px">${kpi(`“${esc(q)}” — last ${days} days`,money(all),`about ${money(all/mo,false)} a month · ${money(all/mo*12,false)} a year`)}${kpi('On receipts',money(iSpent),`${iQty} item${iQty===1?'':'s'} bought`)}${kpi('Bank charges that match',money(tSpent),tx.length?`${tx.length} purchase${tx.length===1?'':'s'}: ${esc([...new Set(tx.map(t=>prettyName([t.desc])))].slice(0,3).join(', '))}${tx.length>3?'…':''}`:'none')}</div>`;
  }
  return `<div class="card"><div class="toolbar"><h2 style="margin:0">Items you buy<span class="sub">from ${receipts} receipt${receipts===1?'':'s'} with items</span></h2><span class="spacer"></span>
    <input type="search" placeholder="Search items, e.g. soda, dutch bros, coke" value="${esc(q)}" onchange="UI.itemQ=this.value;render()" style="min-width:220px">
    <div class="seg">${[30,90,365].map(d=>`<button class="${d===days?'on':''}" onclick="UI.itemDays=${d};render()">${d===365?'1 year':d+' days'}</button>`).join('')}</div></div>
  ${summary}
  ${shown.length?`<div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="num">Bought</th><th class="num">Spent</th><th class="num hide-sm">Per month</th><th class="num hide-sm">Avg price</th></tr></thead><tbody>${shown.map(r=>`<tr><td>${esc(r.name)}<div class="small muted">${esc(r.stores.slice(0,2).join(', '))}${r.up?` · <span class="st warn">▲ price up from ${money(r.up.from)} to ${money(r.up.to)}</span>`:''}</div></td><td class="num">${r.qty}×</td><td class="num">${money(r.spent)}</td><td class="num hide-sm">${money(r.spent/mo)}</td><td class="num hide-sm">${money(r.avg)}</td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty small">${terms.length?'No receipt items match. Bank charges that match are counted above.':'No itemized receipts in this period yet.'}</div>`}
  <p class="small muted" style="margin-bottom:0">Only receipts you upload have items, so these are minimums. Separate search words with commas. Bank charges are included in a search only when they don't already have an itemized receipt, so nothing is counted twice.</p></div>`;
}
function notRecurring(key){(S.notRecurring=S.notRecurring||[]).push(key);save();render();toast('Removed from recurring payments.','Undo',()=>{S.notRecurring=S.notRecurring.filter(k=>k!==key);save();render()})}

/* ---------- autosave to a data file (Chrome / Edge) ---------- */
// The chosen file's handle is kept in IndexedDB so the tracker reconnects to it next time.
const FS={supported:'showSaveFilePicker' in window,handle:null,name:'',state:'none',lastWrite:null,timer:null};
const JSON_TYPES=[{description:'Finance tracker data',accept:{'application/json':['.json']}}];
function queueFileSave(){if(!FS.handle||FS.state!=='ok')return;clearTimeout(FS.timer);FS.timer=setTimeout(fsWrite,600)}
async function fsWrite(){
  if(!FS.handle||FS.state!=='ok')return;
  try{const w=await FS.handle.createWritable();await w.write(JSON.stringify(S,null,1));await w.close();FS.lastWrite=new Date();S.lastBackup=FS.lastWrite.toISOString();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  catch(e){FS.state='error';toast(`Couldn't save to ${FS.name}: ${e.message}`)}
  fsStatus();
}
function adopt(d){delete d.receiptFiles;migrate(d);const b=blank();S={...b,...d,settings:{...b.settings,...(d.settings||{})},debtPlan:{...b.debtPlan,...(d.debtPlan||{})}};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}applyTheme()}
async function fsActivate(opened){
  let d=null;try{const t=await (await FS.handle.getFile()).text();d=t.trim()?JSON.parse(t):null}catch(e){FS.state='error';toast(`${FS.name} isn't valid tracker data.`);return render()}
  const valid=d&&Array.isArray(d.transactions)&&Array.isArray(d.accounts),local=S.transactions.length||S.accounts.length;
  if(valid&&(!local||(d.savedAt||'')>(S.savedAt||'')||(opened&&confirm(`Load the data in ${FS.name}? It replaces what's currently in this browser.\n\nCancel = keep the browser's data and save it into the file instead.`)))){adopt(d);FS.state='ok';toast(`Loaded from ${FS.name}`)}
  else{FS.state='ok';await fsWrite();toast(`Now autosaving to ${FS.name}`)}
  render();
}
async function fsNew(){try{const h=await showSaveFilePicker({suggestedName:'finance-data.json',types:JSON_TYPES});FS.handle=h;FS.name=h.name;FS.state='ok';await IDB.put('__datafile',h).catch(()=>{});await fsWrite();render();toast(`Now autosaving to ${h.name}`)}catch(e){if(e.name!=='AbortError')toast('Could not create the file: '+e.message)}}
async function fsOpen(){try{const [h]=await showOpenFilePicker({types:JSON_TYPES});if(await h.requestPermission({mode:'readwrite'})!=='granted')return toast('Chrome needs permission to save to that file.');FS.handle=h;FS.name=h.name;await IDB.put('__datafile',h).catch(()=>{});await fsActivate(true)}catch(e){if(e.name!=='AbortError')toast('Could not open the file: '+e.message)}}
async function fsReconnect(){try{if(await FS.handle.requestPermission({mode:'readwrite'})==='granted')await fsActivate(false)}catch(e){toast('Could not reconnect: '+e.message)}}
async function fsDisconnect(){if(!confirm(`Stop autosaving to ${FS.name}? The file stays where it is.`))return;await IDB.del('__datafile').catch(()=>{});Object.assign(FS,{handle:null,name:'',state:'none'});render()}
async function fsInit(){
  if(!FS.supported)return;
  try{const h=await IDB.get('__datafile');if(!h)return;FS.handle=h;FS.name=h.name;
    if(await h.queryPermission({mode:'readwrite'})==='granted')await fsActivate(false);else{FS.state='prompt';render()}}catch(e){}
}
function fsStatus(){const el=$('#fsStat');if(!el)return;
  el.innerHTML=FS.state==='ok'?`<span class="muted" title="Every change is saved to this file">✓ Autosaving to ${esc(FS.name)}</span>`
    :FS.state==='prompt'?`<button class="btn sm primary" onclick="fsReconnect()">Reconnect ${esc(FS.name)}</button>`
    :FS.state==='error'?`<button class="btn sm" onclick="fsReconnect()">▲ File not saving — retry</button>`:''}
function fsCard(){
  if(!FS.supported)return `<div class="card"><h2>Autosave to a file</h2><p class="small t2" style="margin:0">Autosaving to a .json file works in Chrome or Edge. Open the tracker there to use it.</p></div>`;
  return `<div class="card"><h2>Autosave to a file</h2>${FS.handle?`<p class="small t2" style="margin-top:0">Every change is saved to <b>${esc(FS.name)}</b>${FS.lastWrite?` — last saved ${FS.lastWrite.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`:''}. When you open the tracker, Chrome asks once to reconnect to it.</p>
    <div class="toolbar" style="margin:0">${FS.state!=='ok'?`<button class="btn primary" onclick="fsReconnect()">Reconnect</button>`:''}<button class="btn" onclick="fsOpen()">Switch to another file…</button><button class="btn ghost danger" onclick="fsDisconnect()">Stop autosaving</button></div>`
    :`<p class="small t2" style="margin-top:0">Save everything to a .json file you choose — for example in your OneDrive folder so it's backed up. The file is updated on every change and loaded when you open the tracker, so it's your master copy.</p>
    <div class="toolbar" style="margin:0"><button class="btn primary" onclick="fsNew()">Create a data file…</button><button class="btn" onclick="fsOpen()">Use an existing data file…</button></div>`}
    <p class="small muted" style="margin-bottom:0">Receipt images and PDFs aren't stored in this file. Include them with Download backup when needed.</p></div>`;
}

const VIEWS={dashboard:vDashboard,insights:vInsights,transactions:vTransactions,budgets:vBudgets,accounts:vAccounts,debts:vDebts,goals:vGoals,import:vImport,receipts:vReceipts,settings:vSettings};
const h0=location.hash.slice(1);if(VIEWS[h0])UI.tab=h0;
applyTheme();
// index.html?demo opens straight into sample data (for the live demo link); it never touches existing data.
if(/[?&]demo\b/.test(location.search)&&!S.transactions.length&&!S.accounts.length){const tab=UI.tab;loadDemo();UI.tab=tab;history.replaceState(null,'','#'+tab)}
render();fsInit();
</script>
